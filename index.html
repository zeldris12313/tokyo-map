<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京自由行地圖筆記</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google 官方 Open Location Code (Plus Code) 解碼套件 -->
  <script src="https://cdn.jsdelivr.net/npm/open-location-code@1.0.4/openlocationcode.min.js"></script>

  <!-- SortableJS 拖拉排序套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <!-- Tesseract.js (收據 OCR 自動辨識) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    #map { height: 320px; width: 100%; border-radius: 1rem; z-index: 1; }
    #modal-adjust-map { height: 220px; width: 100%; border-radius: 0.75rem; z-index: 1; }
    .card-highlight { animation: highlight 2s ease-in-out; }
    @keyframes highlight {
      0% { transform: scale(1); ring: 4px #4f46e5; }
      50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }
      100% { transform: scale(1); }
    }
    .ghost { opacity: 0.4; background: #e0e7ff !important; }
    .hotel-mini-map { height: 160px; width: 100%; border-radius: 0.75rem; z-index: 1; }
  </style>
</head>
<body class="bg-[#f3f4f6] dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">

  <!-- 頂部 Header 與分頁切換 -->
  <header class="bg-[#4f46e5] dark:bg-slate-800 text-white px-4 py-3 shadow-md sticky top-0 z-40 border-b dark:border-slate-700">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2.5">
      
      <!-- 第一排：標題 + 月亮太陽掣 + 主分頁切換 -->
      <div class="w-full md:w-auto flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-2">
          <i class="fa-regular fa-compass text-lg"></i>
          <h1 class="text-base font-bold whitespace-nowrap">東京自由行地圖筆記</h1>
          <!-- 🌙 / ☀️ 深色/淺色模式切換按鈕 (放標題旁最順手) -->
          <button id="theme-toggle-btn" onclick="toggleDarkMode()" class="bg-indigo-700/80 hover:bg-indigo-600 dark:bg-slate-700 text-yellow-300 w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-sm transition ml-1" title="切換深色/淺色模式">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
          </button>
        </div>

       <!-- 主分頁按鈕 (跳轉至獨立專頁) -->
        <nav class="flex items-center bg-indigo-700/70 dark:bg-slate-700 p-1 rounded-xl text-xs font-bold gap-1 w-full sm:w-auto justify-around">
          <a href="index.html" class="flex-1 sm:flex-initial px-2.5 py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition whitespace-nowrap flex items-center justify-center gap-1">
            <i class="fa-solid fa-map-location-dot"></i> 行程地圖
          </a>
          <a href="expenses.html" class="flex-1 sm:flex-initial px-2.5 py-1.5 rounded-lg text-white hover:bg-indigo-600 transition whitespace-nowrap flex items-center justify-center gap-1">
            <i class="fa-solid fa-receipt"></i> 記帳收據
          </a>
          <a href="wishlist.html" class="flex-1 sm:flex-initial px-2.5 py-1.5 rounded-lg text-white hover:bg-indigo-600 transition whitespace-nowrap flex items-center justify-center gap-1">
            <i class="fa-solid fa-bag-shopping"></i> 想買相簿
          </a>
        </nav>

      <!-- 第二排：三個新增快捷按鈕 (強制單行不斷字) -->
      <div class="w-full md:w-auto flex items-center justify-end gap-2">
        <button onclick="openFHModal('flight')" class="flex-1 md:flex-initial justify-center bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap">
          <i class="fa-solid fa-plane"></i> + 航班
        </button>
        <button onclick="openFHModal('hotel')" class="flex-1 md:flex-initial justify-center bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap">
          <i class="fa-solid fa-hotel"></i> + 酒店
        </button>
        <button onclick="openAddModal()" class="flex-1 md:flex-initial justify-center bg-[#facc15] hover:bg-yellow-400 text-slate-900 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap">
          <i class="fa-solid fa-circle-plus"></i> 新增景點/食店
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== 頁面 1: 行程地圖主畫面 ==================== -->
  <div id="view-map-tab" class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- 左側邊欄 -->
    <aside class="md:col-span-1 space-y-5">
      <!-- 1. 主要車站/區域 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-map-location-dot text-indigo-600"></i> 主要車站/區域
          </h2>
          <div class="flex items-center gap-1">
            <span id="region-count" class="text-xs text-slate-400">0個</span>
            <button onclick="openManageRegionsModal()" class="text-xs text-indigo-600 hover:text-indigo-800 ml-1" title="管理區域與排序">
              <i class="fa-solid fa-gear"></i>
            </button>
          </div>
        </div>
        <nav id="region-list" class="space-y-1"></nav>
      </div>

      <!-- 2. 準備物品/待辦清單 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-clipboard-check text-amber-500"></i> 準備物品/待辦清單
          </h2>
          <span class="text-[10px] text-slate-400">按住 ::: 拖拉排序</span>
        </div>

        <div class="space-y-2">
          <div class="flex gap-1.5">
            <input type="text" id="todo-input" placeholder="新增物品 (例: 護照)" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="addTodo('item')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-700">新增</button>
          </div>
          <button onclick="addTodo('divider')" class="w-full text-[11px] text-slate-500 bg-slate-100 hover:bg-slate-200 py-1 rounded-lg border border-dashed border-slate-300">
            + 插入分隔線 (例如: --- 證件類 ---)
          </button>
        </div>

        <div id="todo-list" class="space-y-1.5 max-h-80 overflow-y-auto text-xs pt-1"></div>
      </div>

      <!-- 3. 動態 QR Code 區塊 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="border-b pb-2 flex justify-between items-center">
          <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-qrcode text-indigo-600"></i> 門票 / QR Code 集合
          </h2>
          <span class="text-[10px] text-slate-400">點擊圖片放大</span>
        </div>

        <div class="space-y-2 bg-indigo-50/50 p-2.5 rounded-xl border border-indigo-100 text-xs">
          <input type="text" id="qr-title-input" placeholder="輸入名稱 (例如: Visit Japan QR / 門票)" class="w-full p-2 bg-white border border-slate-200 rounded-lg outline-none">
          <div class="flex gap-1.5 items-center">
            <input type="file" id="qr-file-input" accept="image/*" class="w-full text-[11px] text-slate-500 file:mr-1.5 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
            <button onclick="uploadQRCode()" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold shrink-0 hover:bg-indigo-700">儲存</button>
          </div>
        </div>

        <div id="qr-code-list" class="space-y-2 max-h-80 overflow-y-auto text-xs pt-1"></div>
      </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="md:col-span-3 space-y-5">

      <!-- 1. 置頂行程重點備忘框 -->
      <div class="bg-amber-50/90 rounded-2xl p-4 shadow-sm border border-amber-200 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-note-sticky text-amber-600"></i> 行程重點備忘錄 / 隨手記
          </h3>
          <span id="memo-status" class="text-[10px] text-amber-600">同步中...</span>
        </div>
        <textarea id="memo-input" rows="3" placeholder="在此記下 JR Pass 兌換碼、WiFi 密碼、重要行程提醒等..." class="w-full p-2.5 bg-white/80 border border-amber-200/80 rounded-xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-amber-400"></textarea>

        <div class="flex flex-wrap justify-between items-center gap-2 pt-1 border-t border-amber-200/60">
          <div class="flex items-center gap-2">
            <label class="bg-white hover:bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-lg text-[11px] font-semibold cursor-pointer flex items-center gap-1 shadow-sm transition">
              <i class="fa-solid fa-image"></i> + 上傳備忘圖片
              <input type="file" id="memo-img-file" accept="image/*" class="hidden" onchange="uploadMemoImage(event)">
            </label>
            <button onclick="addMemoDivider()" class="bg-white hover:bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1 shadow-sm transition">
              <i class="fa-solid fa-minus"></i> + 插入分隔線
            </button>
          </div>
          <span class="text-[10px] text-amber-700/70">點擊圖片可放大</span>
        </div>

        <div id="memo-items-container" class="space-y-2 pt-1"></div>
      </div>

      <!-- 2. 航班與酒店卡片區 -->
      <div id="flight-hotel-section" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

      <!-- 3. 即時搜尋列與分類頁籤 -->
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="relative w-full md:w-80">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" placeholder="即時搜尋店名、區域、推介或備註..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-full text-sm outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1" id="category-tabs"></div>
      </div>

      <!-- 4. Google 大地圖總覽區塊 -->
      <div id="map-section" class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col gap-2">
        
        <!-- 上排：標題、同步進度與「定位我」按鈕 -->
        <div class="w-full flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 px-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
              <i class="fa-solid fa-map text-indigo-600 dark:text-indigo-400"></i> 東京地圖總覽
            </span>
            <!-- 實時同步進度徽章 -->
            <div id="sync-progress-badge" class="hidden items-center gap-1.5 bg-indigo-50 dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 px-2 py-0.5 rounded-full text-[10px] font-bold">
              <i class="fa-solid fa-cloud-arrow-down animate-bounce"></i>
              <span id="sync-progress-text">同步中 0%</span>
            </div>
          </div>

          <button type="button" onclick="locateUserPosition()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap self-end sm:self-auto">
            <i class="fa-solid fa-location-crosshairs"></i> 定位我
          </button>
        </div>

        <!-- 頂部細進度條 (載入完成後會自動隱藏) -->
        <div id="sync-progress-bar-container" class="w-full bg-slate-100 dark:bg-slate-700 h-1 rounded-full overflow-hidden hidden">
          <div id="sync-progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-200"></div>
        </div>

        <!-- 下排：100% 滿版闊度地圖 (獨立一層) -->
        <div class="w-full">
          <div id="map" class="w-full"></div>
        </div>

      </div>

      <!-- 目前區域提示 -->
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1">
          目前區域：<span id="current-region-label" class="text-indigo-600">全部車站</span>
        </h3>
        <span id="places-count" class="text-xs text-slate-400">共 0 個地點</span>
      </div>

      <!-- 5. 地點列表卡片 -->
      <div id="places-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    </main>
  </div>
  <!-- ==================== Modal 1: 新增/編輯景點 (以 Google Maps 核心為根基) ==================== -->
  <div id="placeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl flex flex-col">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-sm">新增景點 / 食店</h3>
        <button onclick="closePlaceModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="place-form" class="p-5 space-y-4 text-sm text-slate-800">
        <input type="hidden" id="edit-id">

        <!-- ⭐ Google Maps 原生根基搜尋器 ⭐ -->
        <div class="bg-indigo-50/70 p-3.5 rounded-xl border border-indigo-200 space-y-2.5">
          <div class="flex justify-between items-center">
            <label class="block font-bold text-indigo-950 text-xs flex items-center gap-1.5">
              <i class="fa-brands fa-google text-indigo-600"></i> Google Maps / Plus Code 智慧搜尋定位
            </label>
            <span id="detect-status" class="text-[10px] text-indigo-700 font-bold"></span>
          </div>

          <div class="flex gap-1.5">
            <input type="text" id="map-url" placeholder="貼上 Plus Code (如 MQXC+8M)、Maps 網址 或店名" class="flex-1 p-2 bg-white text-slate-800 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="button" id="parse-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-700 flex items-center gap-1 shrink-0">
              <i class="fa-solid fa-bolt"></i> 自動解析
            </button>
          </div>

          <!-- 直接在 Google Maps 打開搜尋連結 -->
          <div class="flex items-center justify-between text-[11px] pt-0.5">
            <span class="text-slate-500">找不到店名？</span>
            <button type="button" onclick="openGoogleMapsSearch()" class="text-indigo-600 hover:underline font-bold flex items-center gap-1">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> 在 Google Maps 尋找並複製 Plus Code
            </button>
          </div>

          <!-- 搜尋候選列表 -->
          <div id="search-candidates-box" class="hidden bg-white rounded-xl border border-indigo-200 p-2 shadow-sm space-y-1 max-h-44 overflow-y-auto text-xs text-slate-800">
            <div class="text-[11px] text-slate-400 px-1 pb-1 border-b">點擊符合項目自動填寫：</div>
            <div id="search-candidates-list" class="space-y-1"></div>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">景點 / 店名 *</label>
          <input type="text" id="title" required class="w-full p-2.5 bg-white text-slate-800 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">主要車站/區域 *</label>
            <select id="region-select" class="w-full p-2.5 bg-white text-slate-800 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"></select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">類別 *</label>
            <select id="category-select" class="w-full p-2.5 bg-white text-slate-800 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"></select>
          </div>
        </div>

        <!-- 圖片上傳區塊 -->
        <div class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-800">
          <label class="block font-medium text-slate-700 text-xs">主封面圖片 (網址或檔案)</label>
          <input type="url" id="image-url" placeholder="貼上封面圖片網址 https://..." class="w-full p-2 bg-white text-slate-800 border border-slate-200 rounded-lg text-xs outline-none">
          <input type="file" id="image-file" accept="image/*" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">

          <hr class="border-slate-200 my-2">

          <label class="block font-medium text-slate-700 text-xs">額外相片上傳 (可一次選取多張)</label>
          <input type="file" id="extra-images-file" accept="image/*" multiple class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
          <div id="extra-images-preview" class="flex flex-wrap gap-2 pt-1"></div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">推介 / 必食內容</label>
          <input type="text" id="recommendation" placeholder="例如：魚介雞白湯沾麵" class="w-full p-2.5 bg-white text-slate-800 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">備註 / 簡介 / 日本地址</label>
          <textarea id="notes" rows="2" placeholder="例如：人氣排隊名店，只收現金..." class="w-full p-2.5 bg-white text-slate-800 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Google Maps 導航連結</label>
          <input type="url" id="nav-link" placeholder="導航連結" class="w-full p-2.5 bg-white text-slate-800 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- 座標微調 + 自動讀取已有車站快捷鈕 -->
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2.5 text-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
              <i class="fa-solid fa-crosshairs text-indigo-600"></i> 地圖座標微調 (可拖動紅色 Pin 點)
            </span>
            <span class="text-[10px] text-slate-400">可用左上角 +/- 放大縮小</span>
          </div>

          <div class="bg-white p-2 rounded-xl border border-slate-200 space-y-1.5">
            <div class="flex gap-1.5">
              <input type="text" id="jump-station-input" placeholder="輸入自訂車站/地標手動尋找" class="flex-1 p-1.5 bg-slate-50 text-slate-800 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
              <button type="button" onclick="jumpToLocation()" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-900 shrink-0">
                跳轉範圍
              </button>
            </div>
            <div class="flex flex-wrap items-center gap-1 pt-0.5 text-[11px]">
              <span class="text-slate-400 text-[10px]">我的區域:</span>
              <div id="modal-dynamic-station-shortcuts" class="flex flex-wrap gap-1"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <input type="text" id="lat" placeholder="緯度 Lat" class="p-2 bg-white text-slate-800 border border-slate-200 rounded-lg">
            <input type="text" id="lng" placeholder="經度 Lng" class="p-2 bg-white text-slate-800 border border-slate-200 rounded-lg">

  <!-- Firebase SDK & JS Logic (精簡地圖專頁版) -->
  <script type="module">
    import { db, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc, compressImage } from "./firebase-config.js";

    // 城市設定
    const TRIP_CONFIGS = {
      tokyo: {
        title: '東京自由行地圖筆記',
        center: [35.6812, 139.7671],
        zoom: 11,
        defaultRegions: ["東京", "新宿", "澀谷", "淺草/上野", "原宿/表參道", "秋葉原", "池袋", "六本木", "築地/台場"]
      },
      osaka: {
        title: '關西大阪自由行筆記',
        center: [34.6937, 135.5023],
        zoom: 12,
        defaultRegions: ["難波/心齋橋/道頓堀", "梅田", "天王寺/新世界", "環球影城(USJ)", "天保山/港區", "京都", "神戶/奈良"]
      }
    };

    let currentTrip = localStorage.getItem('trip_active') || 'tokyo';

    const categoryPalette = [
      { hex: "#f59e0b", color: "bg-amber-100 text-amber-800 border-amber-300", activeBg: "bg-amber-600 text-white", icon: "fa-utensils" },
      { hex: "#10b981", color: "bg-emerald-100 text-emerald-800 border-emerald-300", activeBg: "bg-emerald-600 text-white", icon: "fa-torii-gate" },
      { hex: "#78716c", color: "bg-stone-100 text-stone-800 border-stone-300", activeBg: "bg-stone-600 text-white", icon: "fa-mug-hot" },
      { hex: "#ec4899", color: "bg-pink-100 text-pink-800 border-pink-300", activeBg: "bg-pink-600 text-white", icon: "fa-bag-shopping" },
      { hex: "#8b5cf6", color: "bg-purple-100 text-purple-800 border-purple-300", activeBg: "bg-purple-600 text-white", icon: "fa-gamepad" },
      { hex: "#0284c7", color: "bg-sky-100 text-sky-800 border-sky-300", activeBg: "bg-sky-600 text-white", icon: "fa-camera" },
      { hex: "#e11d48", color: "bg-rose-100 text-rose-800 border-rose-300", activeBg: "bg-rose-600 text-white", icon: "fa-heart" },
      { hex: "#0d9488", color: "bg-teal-100 text-teal-800 border-teal-300", activeBg: "bg-teal-600 text-white", icon: "fa-cart-shopping" }
    ];

    const defaultCategories = [
      { name: "美食", icon: "fa-utensils", hex: "#f59e0b", color: "bg-amber-100 text-amber-800 border-amber-200", activeBg: "bg-amber-600 text-white" },
      { name: "景點", icon: "fa-torii-gate", hex: "#10b981", color: "bg-emerald-100 text-emerald-800 border-emerald-200", activeBg: "bg-emerald-600 text-white" },
      { name: "咖啡", icon: "fa-mug-hot", hex: "#78716c", color: "bg-stone-100 text-stone-800 border-stone-200", activeBg: "bg-stone-600 text-white" },
      { name: "購物", icon: "fa-bag-shopping", hex: "#ec4899", color: "bg-pink-100 text-pink-800 border-pink-200", activeBg: "bg-pink-600 text-white" }
    ];

    let regions = TRIP_CONFIGS[currentTrip].defaultRegions;
    let categories = defaultCategories;
    let currentRegion = 'all';
    let currentCategory = 'all';
    let allPlaces = [];
    let allFH = [];
    let allTodos = [];
    let allQRCodes = [];
    let allMemoItems = [];

    let leafletMap = null;
    let modalAdjustMap = null;
    let modalAdjustMarker = null;
    let markersMap = {};
    let lightboxImages = [];
    let currentLightboxIndex = 0;

    // 旅程切換 (東京 / 大阪)
    window.switchTrip = (tripKey) => {
      currentTrip = tripKey;
      localStorage.setItem('trip_active', tripKey);

      const btnTokyo = document.getElementById('trip-btn-tokyo');
      const btnOsaka = document.getElementById('trip-btn-osaka');
      const titleEl = document.getElementById('app-main-title');
      const activeClass = "px-2 py-0.5 rounded-md transition text-white bg-indigo-600 shadow-sm";
      const inactiveClass = "px-2 py-0.5 rounded-md transition text-indigo-200 hover:text-white";

      if (btnTokyo && btnOsaka) {
        btnTokyo.className = tripKey === 'tokyo' ? activeClass : inactiveClass;
        btnOsaka.className = tripKey === 'osaka' ? activeClass : inactiveClass;
      }
      if (titleEl) titleEl.innerText = TRIP_CONFIGS[tripKey].title;

      regions = TRIP_CONFIGS[tripKey].defaultRegions;
      currentRegion = 'all';

      if (leafletMap) {
        leafletMap.setView(TRIP_CONFIGS[tripKey].center, TRIP_CONFIGS[tripKey].zoom, { animate: true });
      }

      renderApp();
      populateSelects();
      renderModalStationShortcuts();
    };

    async function saveCloudConfig() {
      await setDoc(doc(db, "settings", "app_config"), { regions, categories });
    }

    function initMap() {
      if (!leafletMap) {
        leafletMap = L.map('map').setView(TRIP_CONFIGS[currentTrip].center, TRIP_CONFIGS[currentTrip].zoom);
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          maxZoom: 20,
          subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
          attribution: 'Google Maps'
        }).addTo(leafletMap);

        const stopCameraLock = () => {
          if (window.isTrackingUser && window.isCameraLocked) {
            window.isCameraLocked = false;
            const locateBtn = document.querySelector("button[onclick='locateUserPosition()']");
            if (locateBtn) {
              locateBtn.innerHTML = '<i class="fa-solid fa-crosshairs"></i> 重回我位置';
              locateBtn.className = "bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap";
            }
          }
        };
        leafletMap.on('dragstart movestart zoomstart touchstart', stopCameraLock);
      }
    }

    function initModalAdjustMap(lat = 35.6812, lng = 139.7671) {
      if (!modalAdjustMap) {
        modalAdjustMap = L.map('modal-adjust-map', { zoomControl: true, scrollWheelZoom: true }).setView([lat, lng], 16);
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(modalAdjustMap);
        modalAdjustMap.on('click', (e) => updateModalAdjustMarker(e.latlng.lat, e.latlng.lng));
      }
      updateModalAdjustMarker(lat, lng);
      renderModalStationShortcuts();
      setTimeout(() => { if (modalAdjustMap) modalAdjustMap.invalidateSize(); }, 200);
    }

    function updateModalAdjustMarker(lat, lng, zoomLevel = 16) {
      const latVal = parseFloat(lat);
      const lngVal = parseFloat(lng);
      if (isNaN(latVal) || isNaN(lngVal)) return;

      document.getElementById('lat').value = latVal.toFixed(6);
      document.getElementById('lng').value = lngVal.toFixed(6);

      if (modalAdjustMarker) {
        modalAdjustMarker.setLatLng([latVal, lngVal]);
      } else if (modalAdjustMap) {
        modalAdjustMarker = L.marker([latVal, lngVal], { draggable: true }).addTo(modalAdjustMap);
        modalAdjustMarker.on('dragend', (e) => {
          const newPos = e.target.getLatLng();
          document.getElementById('lat').value = newPos.lat.toFixed(6);
          document.getElementById('lng').value = newPos.lng.toFixed(6);
        });
      }
      if (modalAdjustMap) modalAdjustMap.setView([latVal, lngVal], zoomLevel);
    }

    function renderModalStationShortcuts() {
      const container = document.getElementById('modal-dynamic-station-shortcuts');
      if (!container) return;
      container.innerHTML = regions.map(r => `
        <button type="button" onclick="quickJump('${r}')" class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded hover:bg-indigo-100 font-medium text-[10px]">
          ${r}
        </button>
      `).join('');
    }

    window.jumpToLocation = async () => {
      const query = document.getElementById('jump-station-input').value.trim();
      if (!query) return alert('請輸入欲跳轉的車站或地標名稱！');
      await executeJump(query);
    };

    window.quickJump = async (stationName) => {
      document.getElementById('jump-station-input').value = stationName;
      await executeJump(stationName);
    };

    async function executeJump(query) {
      try {
        const fullQuery = query.includes('Japan') || query.includes('日本') ? query : `${query} Japan`;
        const apiUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}&limit=1`;
        const res = await fetch(apiUrl, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
        const data = await res.json();
        if (data && data.length > 0) {
          updateModalAdjustMarker(parseFloat(data[0].lat), parseFloat(data[0].lon), 16);
        } else {
          alert('找不到該地標範圍，請嘗試更具體地名。');
        }
      } catch (err) {
        alert('跳轉失敗，請確認網絡連接。');
      }
    }

    // 定位邏輯
    window.userLocMarker = null;
    window.userLocCircle = null;
    window.watchId = null;
    window.isTrackingUser = false;
    window.locateUserPosition = () => {
      if (!navigator.geolocation) return alert("你的瀏覽器不支援 GPS 定位！");
      const locateBtn = document.querySelector("button[onclick='locateUserPosition()']");

      if (window.isTrackingUser && window.watchId !== null) {
        navigator.geolocation.clearWatch(window.watchId);
        window.watchId = null;
        window.isTrackingUser = false;
        if (locateBtn) {
          locateBtn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> 定位我';
          locateBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap";
        }
        return;
      }

      window.isTrackingUser = true;
      let hasCenteredOnce = false;

      if (locateBtn) {
        locateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 追蹤中...';
        locateBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap animate-pulse";
      }

      window.watchId = navigator.geolocation.watchPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy || 20;

        if (!leafletMap) initMap();
        if (window.userLocCircle) {
          window.userLocCircle.setLatLng([lat, lng]);
          window.userLocCircle.setRadius(accuracy);
        } else {
          window.userLocCircle = L.circle([lat, lng], { radius: accuracy, color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 0.2, weight: 1.5 }).addTo(leafletMap);
        }

        const userPulseIcon = L.divIcon({
          className: '',
          html: `<div style="position:relative; width:20px; height:20px; display:flex; align-items:center; justify-content:center;"><div style="position:absolute; width:20px; height:20px; border-radius:50%; background:rgba(37,99,235,0.4); animation: ping 1.5s cubic-bezier(0,0,0.2,1) infinite;"></div><div style="width:14px; height:14px; border-radius:50%; background:#2563eb; border:2.5px solid #ffffff; box-shadow:0 0 6px rgba(0,0,0,0.45); z-index:2;"></div></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });

        if (window.userLocMarker) {
          window.userLocMarker.setLatLng([lat, lng]);
        } else {
          window.userLocMarker = L.marker([lat, lng], { icon: userPulseIcon }).addTo(leafletMap);
        }

        if (!hasCenteredOnce) {
          leafletMap.setView([lat, lng], 16, { animate: true });
          hasCenteredOnce = true;
        }
      }, (err) => {
        alert("無法取得 GPS 定位，請確認手機設定。");
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 });
    };

    window.openGoogleMapsSearch = () => {
      const val = document.getElementById('map-url').value.trim() || document.getElementById('title').value.trim();
      const q = encodeURIComponent(val ? `${val} 日本` : '日本');
      window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
    };

    // Plus Code 解析
    let searchCandidates = [];
    document.getElementById('parse-btn').addEventListener('click', async () => {
      const inputStr = document.getElementById('map-url').value.trim();
      const statusEl = document.getElementById('detect-status');
      const boxEl = document.getElementById('search-candidates-box');
      const listEl = document.getElementById('search-candidates-list');

      if (!inputStr) return alert('請輸入 Plus Code、Google Maps 網址 或店名！');
      statusEl.innerText = '正在解析中...';
      boxEl.classList.add('hidden');
      listEl.innerHTML = '';

      const plusCodeRegex = /([23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3})/i;
      const plusMatch = inputStr.match(plusCodeRegex);
      if (plusMatch && typeof OpenLocationCode !== 'undefined') {
        const rawCode = plusMatch[1].toUpperCase();
        try {
          if (OpenLocationCode.isValid(rawCode)) {
            const center = TRIP_CONFIGS[currentTrip].center;
            let fullCode = OpenLocationCode.isShort(rawCode) ? OpenLocationCode.recoverNearest(rawCode, center[0], center[1]) : rawCode;
            const coord = OpenLocationCode.decode(fullCode);
            updateModalAdjustMarker(coord.latitudeCenter, coord.longitudeCenter, 17);
            
            const cleanTitle = inputStr.replace(plusCodeRegex, '').replace(/,/g, '').trim();
            if (cleanTitle) {
              document.getElementById('title').value = cleanTitle;
              document.getElementById('notes').value = cleanTitle;
            }
            document.getElementById('nav-link').value = `https://www.google.com/maps/search/?api=1&query=${coord.latitudeCenter},${coord.longitudeCenter}`;
            statusEl.innerText = '🎯 Plus Code 定位成功！';
            return;
          }
        } catch (e) {}
      }

      try {
        const apiUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(inputStr + ' Japan')}&limit=6&addressdetails=1`;
        const res = await fetch(apiUrl, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
        searchCandidates = await res.json();
        if (searchCandidates && searchCandidates.length > 0) {
          statusEl.innerText = `找到 ${searchCandidates.length} 間店家，請點選：`;
          boxEl.classList.remove('hidden');
          listEl.innerHTML = searchCandidates.map((item, idx) => `
            <div onclick="selectCandidate(${idx})" class="p-2 hover:bg-indigo-50 rounded-lg cursor-pointer transition border border-slate-100 flex flex-col gap-0.5">
              <div class="font-bold text-slate-800 text-xs flex justify-between"><span>📍 ${item.name || item.display_name.split(',')[0]}</span><span class="text-[10px] text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">選擇</span></div>
              <div class="text-[11px] text-slate-500 truncate">${item.display_name}</div>
            </div>
          `).join('');
          selectCandidate(0, false);
        } else {
          statusEl.innerText = '❌ 找不到該店名，請點上方連結在 Google Maps 查詢';
        }
      } catch (err) {
        statusEl.innerText = '⚠️ 搜尋失敗，請手動拖曳定位';
      }
    });

    window.selectCandidate = (idx, hideBox = true) => {
      const item = searchCandidates[idx];
      if (!item) return;
      const shortName = item.name || item.display_name.split(',')[0];
      document.getElementById('title').value = shortName;
      document.getElementById('notes').value = item.display_name;
      updateModalAdjustMarker(item.lat, item.lon, 17);
      document.getElementById('detect-status').innerText = `✅ 已選取：${shortName}`;
      if (!document.getElementById('nav-link').value) {
        document.getElementById('nav-link').value = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lon}`;
      }
      if (hideBox) document.getElementById('search-candidates-box').classList.add('hidden');
    };

    // 景點儲存
    document.getElementById('place-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;
      const titleVal = (document.getElementById('title').value || '').trim();

      const rawLat = parseFloat(document.getElementById('lat').value);
      const rawLng = parseFloat(document.getElementById('lng').value);
      const validLat = Number.isFinite(rawLat) ? rawLat : null;
      const validLng = Number.isFinite(rawLng) ? rawLng : null;

      const duplicateItem = allPlaces.find(p => {
        if (editId && p.id === editId) return false;
        const isSameTitle = p.title && p.title.trim().toLowerCase() === titleVal.toLowerCase();
        const isSameCoord = validLat !== null && validLng !== null && p.lat === validLat && p.lng === validLng;
        return isSameTitle || isSameCoord;
      });

      if (duplicateItem) {
        alert(`⚠️ 已有重複景點：「${duplicateItem.title}」！`);
        return;
      }

      const fileInput = document.getElementById('image-file');
      const extraFileInput = document.getElementById('extra-images-file');
      
      let finalImg = document.getElementById('image-url').value || '';
      if (fileInput.files.length > 0) {
        finalImg = await compressImage(fileInput.files[0]);
      }

      let newExtraImages = [...existingExtraImages];
      if (extraFileInput.files.length > 0) {
        for (let f of extraFileInput.files) {
          const b64 = await compressImage(f);
          newExtraImages.push(b64);
        }
      }

      const placeData = {
        trip: currentTrip,
        title: titleVal,
        region: document.getElementById('region-select').value || (regions[0] || '市區'),
        category: document.getElementById('category-select').value || (categories[0]?.name || '美食'),
        imageUrl: finalImg,
        extraImages: newExtraImages,
        recommendation: (document.getElementById('recommendation').value || '').trim(),
        notes: (document.getElementById('notes').value || '').trim(),
        navLink: (document.getElementById('nav-link').value || '').trim(),
        lat: validLat,
        lng: validLng,
      };

      try {
        if (editId) {
          await updateDoc(doc(db, "places", editId), placeData);
        } else {
          placeData.status = 'unvisited';
          placeData.createdAt = new Date();
          await addDoc(collection(db, "places"), placeData);
        }
        closePlaceModal();
      } catch (err) {
        alert("儲存失敗！原因：" + err.message);
      }
    });

    // 渲染主畫面
    function renderApp() {
      const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

      document.getElementById('region-count').innerText = `${regions.length}個`;
      let regHTML = `
        <button onclick="setRegion('all')" class="w-full flex justify-between items-center px-3 py-2 rounded-xl text-xs font-medium transition ${currentRegion === 'all' ? 'bg-[#4f46e5] text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
          <span>全部車站/區域</span><span class="${currentRegion === 'all' ? 'bg-indigo-700 text-white' : 'bg-slate-100 text-slate-500'} px-2 py-0.5 rounded-full text-[10px]">${allPlaces.filter(p => (p.trip || 'tokyo') === currentTrip).length}</span>
        </button>
      `;
      regions.forEach(r => {
        const count = allPlaces.filter(p => (p.trip || 'tokyo') === currentTrip && (p.region === r || (r.includes('/') && p.region && r.split('/').includes(p.region)))).length;
        const active = currentRegion === r;
        regHTML += `
          <button onclick="setRegion('${r}')" class="w-full flex justify-between items-center px-3 py-2 rounded-xl text-xs font-medium transition ${active ? 'bg-[#4f46e5] text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
            <span>${r}</span><span class="${active ? 'bg-indigo-700 text-white' : 'bg-slate-100 text-slate-400'} px-2 py-0.5 rounded-full text-[10px]">${count}</span>
          </button>
        `;
      });
      document.getElementById('region-list').innerHTML = regHTML;

      let catHTML = `<button onclick="setCategory('all')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap shadow-sm border ${currentCategory === 'all' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}">全部</button>`;
      categories.forEach((c, idx) => {
        const active = currentCategory === c.name;
        const palette = categoryPalette[idx % categoryPalette.length];
        catHTML += `
          <button onclick="setCategory('${c.name}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap flex items-center gap-1.5 border shadow-sm ${active ? `${c.activeBg || palette.activeBg} border-transparent shadow` : `${c.color || palette.color} hover:opacity-80`}">
            <span>${c.name}</span><i class="fa-solid ${c.icon || 'fa-tag'} text-[11px]"></i>
          </button>
        `;
      });
      document.getElementById('category-tabs').innerHTML = catHTML;

      const filtered = allPlaces.filter(p => {
        if ((p.trip || 'tokyo') !== currentTrip) return false;
        const matchRegion = currentRegion === 'all' || p.region === currentRegion || (currentRegion.includes('/') && p.region && currentRegion.split('/').includes(p.region));
        const matchCategory = currentCategory === 'all' || p.category === currentCategory;
        const matchSearch = !searchKeyword || 
          (p.title && p.title.toLowerCase().includes(searchKeyword)) ||
          (p.region && p.region.toLowerCase().includes(searchKeyword)) ||
          (p.category && p.category.toLowerCase().includes(searchKeyword)) ||
          (p.recommendation && p.recommendation.toLowerCase().includes(searchKeyword));
        return matchRegion && matchCategory && matchSearch;
      });

      document.getElementById('current-region-label').innerText = currentRegion === 'all' ? '全部區域' : currentRegion;
      document.getElementById('places-count').innerText = `共 ${filtered.length} 個地點`;

      initMap();
      Object.values(markersMap).forEach(m => leafletMap.removeLayer(m));
      markersMap = {};
      const bounds = [];

      filtered.forEach(item => {
        if (item.lat && item.lng) {
          const marker = L.marker([item.lat, item.lng]).addTo(leafletMap);
          marker.bindPopup(`<b>${item.title}</b><br>${item.category} | ${item.region}`);
          markersMap[item.id] = marker;
          bounds.push([item.lat, item.lng]);
        }
      });

      document.getElementById('places-grid').innerHTML = filtered.map(item => {
        const isVisited = item.status === 'visited';
        return `
          <div id="card-${item.id}" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden flex flex-col justify-between">
            <div>
              ${item.imageUrl ? `<img src="${item.imageUrl}" loading="lazy" class="w-full h-44 object-cover">` : ''}
              <div class="p-4 space-y-2">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">${item.category}</span>
                  <button onclick="toggleCheck('${item.id}', '${item.status}')" class="text-xs px-2 py-0.5 rounded-full border ${isVisited ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'text-slate-400 border-slate-200'}">
                    ${isVisited ? '✓ 已打卡' : '未打卡'}
                  </button>
                </div>
                <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100">${item.title}</h4>
                ${item.recommendation ? `<div class="text-xs text-amber-700 bg-amber-50 p-2 rounded-lg">推介：${item.recommendation}</div>` : ''}
                ${item.notes ? `<div class="text-xs text-slate-500">${item.notes}</div>` : ''}
              </div>
            </div>
            <div class="p-4 pt-0 flex justify-between items-center text-xs text-slate-500 border-t border-slate-50 dark:border-slate-700 pt-3">
              <button onclick="focusOnMap('${item.id}', ${item.lat}, ${item.lng})" class="text-indigo-600 font-bold hover:underline">顯示地圖</button>
              <div class="flex gap-2">
                ${item.navLink ? `<a href="${item.navLink}" target="_blank" class="text-indigo-600 hover:underline">導航</a>` : ''}
                <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen-to-square"></i></button>
                <button onclick="deletePlace('${item.id}')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setRegion = (r) => { currentRegion = r; renderApp(); };
    window.setCategory = (c) => { currentCategory = c; renderApp(); };
    window.toggleCheck = async (id, status) => {
      await updateDoc(doc(db, "places", id), { status: status === 'visited' ? 'unvisited' : 'visited' });
    };
    window.deletePlace = async (id) => {
      if (confirm("確定刪除此景點？")) await deleteDoc(doc(db, "places", id));
    };

    window.focusOnMap = (id, lat, lng) => {
      document.getElementById('map-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (lat && lng && leafletMap) {
        leafletMap.setView([lat, lng], 16, { animate: true });
        if (markersMap[id]) markersMap[id].openPopup();
      }
    };

    // 隨手備忘
    const memoInput = document.getElementById('memo-input');
    const memoStatus = document.getElementById('memo-status');
    let memoTimeout = null;

    memoInput.addEventListener('input', () => {
      memoStatus.innerText = '儲存中...';
      clearTimeout(memoTimeout);
      memoTimeout = setTimeout(async () => {
        await setDoc(doc(db, "settings", "memo"), { content: memoInput.value });
        memoStatus.innerText = '已同步至雲端';
      }, 800);
    });

    onSnapshot(doc(db, "settings", "memo"), (docSnap) => {
      if (docSnap.exists() && document.activeElement !== memoInput) {
        memoInput.value = docSnap.data().content || '';
        memoStatus.innerText = '已同步至雲端';
      }
    });

    window.uploadMemoImage = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const b64 = await compressImage(file);
      await addDoc(collection(db, "memo_items"), { type: 'image', imageUrl: b64, createdAt: new Date() });
      e.target.value = '';
    };

    window.addMemoDivider = async () => {
      const title = prompt("請輸入分隔線文字:", "重要圖片");
      if (title) await addDoc(collection(db, "memo_items"), { type: 'divider', title, createdAt: new Date() });
    };

    window.deleteMemoItem = async (id) => {
      if (confirm("確定刪除？")) await deleteDoc(doc(db, "memo_items", id));
    };

    function renderMemoItems() {
      const container = document.getElementById('memo-items-container');
      if (!container) return;
      container.innerHTML = allMemoItems.map(item => {
        if (item.type === 'divider') {
          return `<div class="flex justify-between border-b border-amber-300 pt-2 pb-1 text-xs font-bold text-amber-900"><span>--- ${item.title} ---</span><button onclick="deleteMemoItem('${item.id}')" class="text-amber-600">✕</button></div>`;
        }
        return `<div class="inline-block relative m-1"><img src="${item.imageUrl}" class="w-16 h-16 object-cover rounded-lg border border-amber-200"><button onclick="deleteMemoItem('${item.id}')" class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[9px]">✕</button></div>`;
      }).join('');
    }

    onSnapshot(collection(db, "memo_items"), (snapshot) => {
      allMemoItems = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      allMemoItems.sort((a, b) => (a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0) - (b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0));
      renderMemoItems();
    });

    // ⭐ 補回：讀取 Firebase 儲存的自訂分類與區域 ⭐
    onSnapshot(doc(db, "settings", "app_config"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.regions && Array.isArray(data.regions) && data.regions.length > 0) {
          regions = data.regions;
        }
        if (data.categories && Array.isArray(data.categories) && data.categories.length > 0) {
          categories = data.categories.map((c, idx) => {
            if (typeof c === 'string') {
              const fallback = categoryPalette[idx % categoryPalette.length];
              return {
                name: c,
                icon: fallback.icon || 'fa-tag',
                hex: fallback.hex || '#4f46e5',
                color: fallback.color || 'bg-slate-100 text-slate-800 border-slate-300',
                activeBg: fallback.activeBg || 'bg-slate-800 text-white'
              };
            } else if (c && typeof c === 'object') {
              const fallback = categoryPalette[idx % categoryPalette.length];
              return {
                name: c.name || '未命名',
                icon: c.icon || fallback.icon || 'fa-tag',
                hex: c.hex || fallback.hex || '#4f46e5',
                color: c.color || fallback.color || 'bg-slate-100 text-slate-800 border-slate-300',
                activeBg: c.activeBg || fallback.activeBg || 'bg-slate-800 text-white'
              };
            }
            return c;
          });
        }
        renderApp();
        renderModalStationShortcuts();
        populateSelects();
      }
    });

    // 監聽景點
    onSnapshot(collection(db, "places"), (snapshot) => {
      allPlaces = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      renderApp();
    });

    let existingExtraImages = [];
    window.openAddModal = () => {
      document.getElementById('place-form').reset();
      document.getElementById('edit-id').value = '';
      existingExtraImages = [];
      document.getElementById('extra-images-preview').innerHTML = '';
      populateSelects();
      document.getElementById('placeModal').classList.remove('hidden');
      initModalAdjustMap(TRIP_CONFIGS[currentTrip].center[0], TRIP_CONFIGS[currentTrip].center[1]);
    };

    window.openEditModal = (id) => {
      const item = allPlaces.find(p => p.id === id);
      if (!item) return;
      populateSelects();
      document.getElementById('edit-id').value = item.id;
      document.getElementById('title').value = item.title || '';
      document.getElementById('region-select').value = item.region || regions[0];
      document.getElementById('category-select').value = item.category || categories[0].name;
      document.getElementById('image-url').value = item.imageUrl || '';
      document.getElementById('recommendation').value = item.recommendation || '';
      document.getElementById('notes').value = item.notes || '';
      document.getElementById('nav-link').value = item.navLink || '';
      document.getElementById('lat').value = item.lat || '';
      document.getElementById('lng').value = item.lng || '';
      existingExtraImages = item.extraImages || [];
      document.getElementById('placeModal').classList.remove('hidden');
      initModalAdjustMap(item.lat || 35.6812, item.lng || 139.7671);
    };

    window.closePlaceModal = () => document.getElementById('placeModal').classList.add('hidden');

    function populateSelects() {
      document.getElementById('region-select').innerHTML = regions.map(r => `<option value="${r}">${r}</option>`).join('');
      document.getElementById('category-select').innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    const searchInput = document.getElementById('search-input');
    ['input', 'keyup'].forEach(evt => searchInput.addEventListener(evt, () => renderApp()));

    window.toggleDarkMode = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    };
    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-icon');
      if (icon) icon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-yellow-300';
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      updateThemeIcon(true);
    }
    switchTrip(currentTrip);

    // ===== ⭐ Service Worker 離線快取引擎 ⭐ =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swScript = `
          const CACHE_NAME = 'travel-app-v3';
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            if (e.request.method === 'GET' && !e.request.url.includes('firestore.googleapis.com')) {
              e.respondWith(
                fetch(e.request)
                  .then((res) => {
                    const resClone = res.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(e.request, resClone));
                    return res;
                  })
                  .catch(() => caches.match(e.request))
              );
            }
          });
        `;
        const blob = new Blob([swScript], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
