<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京自由行地圖筆記</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SortableJS 拖拉排序套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    #map { height: 320px; width: 100%; border-radius: 1rem; z-index: 1; }
    .card-highlight { animation: highlight 2s ease-in-out; }
    @keyframes highlight {
      0% { transform: scale(1); ring: 4px #4f46e5; }
      50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }
      100% { transform: scale(1); }
    }
    .ghost { opacity: 0.4; background: #e0e7ff !important; }
    .hotel-mini-map { height: 160px; width: 100%; border-radius: 0.75rem; z-index: 1; }
  </style>
</head>
<body class="bg-[#f3f4f6] text-slate-800 font-sans min-h-screen">

  <!-- 頂部 Header -->
  <header class="bg-[#4f46e5] text-white px-6 py-3 shadow-md flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <i class="fa-regular fa-compass text-xl"></i>
      <h1 class="text-lg font-bold">東京自由行地圖筆記</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openFHModal('flight')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition">
        <i class="fa-solid fa-plane"></i> + 新增航班
      </button>
      <button onclick="openFHModal('hotel')" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm transition">
        <i class="fa-solid fa-hotel"></i> + 新增酒店
      </button>
      <button onclick="openAddModal()" class="bg-[#facc15] hover:bg-yellow-400 text-slate-900 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm transition">
        <i class="fa-solid fa-circle-plus"></i> 新增景點/食店
      </button>
    </div>
  </header>

  <!-- 主體內容 -->
  <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- 左側邊欄 -->
    <aside class="md:col-span-1 space-y-5">
      <!-- 1. 主要車站/區域 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-map-location-dot text-indigo-600"></i> 主要車站/區域
          </h2>
          <div class="flex items-center gap-1">
            <span id="region-count" class="text-xs text-slate-400">0個</span>
            <button onclick="openManageRegionsModal()" class="text-xs text-indigo-600 hover:text-indigo-800 ml-1" title="管理區域與排序">
              <i class="fa-solid fa-gear"></i>
            </button>
          </div>
        </div>
        <nav id="region-list" class="space-y-1"></nav>
      </div>

      <!-- 2. 準備物品/待辦清單 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-clipboard-check text-amber-500"></i> 準備物品/待辦清單
          </h2>
          <span class="text-[10px] text-slate-400">按住 ::: 拖拉排序</span>
        </div>

        <div class="space-y-2">
          <div class="flex gap-1.5">
            <input type="text" id="todo-input" placeholder="新增物品 (例: 護照)" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="addTodo('item')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-700">新增</button>
          </div>
          <button onclick="addTodo('divider')" class="w-full text-[11px] text-slate-500 bg-slate-100 hover:bg-slate-200 py-1 rounded-lg border border-dashed border-slate-300">
            + 插入分隔線 (例如: --- 證件類 ---)
          </button>
        </div>

        <div id="todo-list" class="space-y-1.5 max-h-80 overflow-y-auto text-xs pt-1"></div>
      </div>

      <!-- 3. 動態 QR Code 區塊 (新增) -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="border-b pb-2 flex justify-between items-center">
          <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-qrcode text-indigo-600"></i> 門票 / QR Code 集合
          </h2>
          <span class="text-[10px] text-slate-400">點擊圖片放大</span>
        </div>

        <!-- 上傳表單區域 -->
        <div class="space-y-2 bg-indigo-50/50 p-2.5 rounded-xl border border-indigo-100 text-xs">
          <input type="text" id="qr-title-input" placeholder="輸入名稱 (例如: Visit Japan QR / 展望台門票)" class="w-full p-2 bg-white border border-slate-200 rounded-lg outline-none">
          <div class="flex gap-1.5 items-center">
            <input type="file" id="qr-file-input" accept="image/*" class="w-full text-[11px] text-slate-500 file:mr-1.5 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
            <button onclick="uploadQRCode()" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold shrink-0 hover:bg-indigo-700">儲存</button>
          </div>
        </div>

        <!-- QR Code 清單卡片列表 -->
        <div id="qr-code-list" class="space-y-2 max-h-80 overflow-y-auto text-xs pt-1"></div>
      </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="md:col-span-3 space-y-5">

      <!-- 1. 置頂行程重點備忘框 (含圖片上傳與分隔線) -->
      <div class="bg-amber-50/90 rounded-2xl p-4 shadow-sm border border-amber-200 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-note-sticky text-amber-600"></i> 行程重點備忘錄 / 隨手記
          </h3>
          <span id="memo-status" class="text-[10px] text-amber-600">同步中...</span>
        </div>
        <textarea id="memo-input" rows="3" placeholder="在此記下 JR Pass 兌換碼、WiFi 密碼、重要行程提醒等..." class="w-full p-2.5 bg-white/80 border border-amber-200/80 rounded-xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-amber-400"></textarea>

        <!-- 備忘錄操作工具列 -->
        <div class="flex flex-wrap justify-between items-center gap-2 pt-1 border-t border-amber-200/60">
          <div class="flex items-center gap-2">
            <label class="bg-white hover:bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-lg text-[11px] font-semibold cursor-pointer flex items-center gap-1 shadow-sm transition">
              <i class="fa-solid fa-image"></i> + 上傳備忘圖片
              <input type="file" id="memo-img-file" accept="image/*" class="hidden" onchange="uploadMemoImage(event)">
            </label>
            <button onclick="addMemoDivider()" class="bg-white hover:bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1 shadow-sm transition">
              <i class="fa-solid fa-minus"></i> + 插入分隔線
            </button>
          </div>
          <span class="text-[10px] text-amber-700/70">點擊圖片可放大</span>
        </div>

        <!-- 備忘錄圖片與分隔線展示區 -->
        <div id="memo-items-container" class="space-y-2 pt-1"></div>
      </div>

      <!-- 2. 航班與酒店卡片區 -->
      <div id="flight-hotel-section" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

      <!-- 3. 即時搜尋列與分類頁籤 -->
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="relative w-full md:w-80">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" placeholder="即時搜尋店名、區域、推介或備註..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-full text-sm outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1" id="category-tabs"></div>
      </div>

      <!-- 4. Google 大地圖總覽區塊 -->
      <div id="map-section" class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-2 px-1">
          <span class="text-xs font-bold text-slate-500 uppercase flex items-center gap-1">
            <i class="fa-solid fa-map text-indigo-600"></i> 東京區域 Google 地圖總覽
          </span>
          <span class="text-[10px] text-slate-400">點擊標記預覽 / 拖動 Pin 點校正座標</span>
        </div>
        <div id="map"></div>
      </div>

      <!-- 目前區域提示 -->
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1">
          目前區域：<span id="current-region-label" class="text-indigo-600">全部車站</span>
        </h3>
        <span id="places-count" class="text-xs text-slate-400">共 0 個地點</span>
      </div>

      <!-- 5. 地點列表卡片 -->
      <div id="places-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    </main>
  </div>

  <!-- Modal 1: 新增/編輯景點 -->
  <div id="placeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl flex flex-col">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-sm">新增景點 / 食店</h3>
        <button onclick="closePlaceModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="place-form" class="p-5 space-y-4 text-sm">
        <input type="hidden" id="edit-id">

        <div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
          <label class="block font-medium text-slate-700 mb-1 text-xs">Google Maps 網址 (可自動抓取名稱、座標、分類與區域)</label>
          <div class="flex gap-2">
            <input type="url" id="map-url" placeholder="https://www.google.com/maps/place/..." class="flex-1 p-2 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="button" id="parse-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-indigo-700">解析</button>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">景點 / 店名 *</label>
          <input type="text" id="title" required class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">主要車站/區域 *</label>
            <select id="region-select" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">類別 *</label>
            <select id="category-select" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></select>
          </div>
        </div>

        <div class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <label class="block font-medium text-slate-700 text-xs">主封面圖片 (網址或檔案)</label>
          <input type="url" id="image-url" placeholder="貼上封面圖片網址 https://..." class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs outline-none">
          <input type="file" id="image-file" accept="image/*" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">

          <hr class="border-slate-200 my-2">

          <label class="block font-medium text-slate-700 text-xs">額外相片上傳 (可一次選取多張)</label>
          <input type="file" id="extra-images-file" accept="image/*" multiple class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
          <div id="extra-images-preview" class="flex flex-wrap gap-2 pt-1"></div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">推介 / 必食內容</label>
          <input type="text" id="recommendation" placeholder="例如：魚介雞白湯沾麵" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">備註 / 簡介</label>
          <textarea id="notes" rows="2" placeholder="例如：人氣排隊名店，只收現金..." class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Google Maps 導航連結</label>
          <input type="url" id="nav-link" placeholder="導航連結" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
          <span class="text-xs font-semibold text-slate-700">座標微調（解析後可直接在地圖上拖動 Pin 點校正）</span>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <input type="text" id="lat" placeholder="緯度 Lat" class="p-2 bg-white border rounded-lg">
            <input type="text" id="lng" placeholder="經度 Lng" class="p-2 bg-white border rounded-lg">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition">儲存景點</button>
      </form>
    </div>
  </div>

  <!-- Modal 2: 航班 / 酒店 Modal -->
  <div id="fhModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl flex flex-col">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
        <h3 id="fhModalTitle" class="font-bold text-slate-800 text-sm">新增事項</h3>
        <button onclick="closeFHModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="fh-form" class="p-5 space-y-4 text-sm">
        <input type="hidden" id="fh-edit-id">
        <input type="hidden" id="fh-type">

        <div>
          <label class="block font-medium text-slate-700 mb-1" id="fh-title-label">名稱 *</label>
          <input type="text" id="fh-title" required class="w-full p-2.5 border border-slate-200 rounded-xl outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1" id="fh-date1-label">時間 1</label>
            <input type="text" id="fh-date1" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1" id="fh-date2-label">時間 2</label>
            <input type="text" id="fh-date2" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1" id="fh-code-label">確認號 / 代碼</label>
            <input type="text" id="fh-code" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1" id="fh-extra-label">補充細節</label>
            <input type="text" id="fh-extra" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none">
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">地址 / Google Maps 導航</label>
          <input type="text" id="fh-nav" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none">
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">備註 / 注意事項</label>
          <textarea id="fh-notes" rows="2" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition">儲存資料</button>
      </form>
    </div>
  </div>

  <!-- Modal 3 & 4: 管理區域 / 類別 -->
  <div id="manageRegionsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">管理區域 (拖拉排序)</h3>
        <button onclick="closeManageRegionsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="new-region-input" placeholder="輸入新區域" class="flex-1 p-2 border rounded-xl text-xs outline-none">
        <button onclick="addRegion()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">新增</button>
      </div>
      <div id="manage-regions-list" class="space-y-2 max-h-60 overflow-y-auto text-xs"></div>
    </div>
  </div>

  <div id="manageCategoriesModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">管理類別 (拖拉排序)</h3>
        <button onclick="closeManageCategoriesModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="new-cat-input" placeholder="輸入新類別" class="flex-1 p-2 border rounded-xl text-xs outline-none">
        <button onclick="addCategory()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">新增</button>
      </div>
      <div id="manage-cats-list" class="space-y-2 max-h-60 overflow-y-auto text-xs"></div>
    </div>
  </div>

  <!-- Modal 5: 全螢幕相片檢視燈箱 (Lightbox) -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center hidden p-4 select-none" onclick="closeLightbox(event)">
    <button onclick="closeLightbox(event, true)" class="absolute top-4 right-4 text-white hover:text-slate-300 text-2xl z-10 p-2">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button onclick="prevLightboxImage(event)" class="absolute left-4 text-white hover:text-slate-300 text-3xl z-10 p-2 bg-slate-800/50 rounded-full w-12 h-12 flex items-center justify-center">
      ‹
    </button>
    <button onclick="nextLightboxImage(event)" class="absolute right-4 text-white hover:text-slate-300 text-3xl z-10 p-2 bg-slate-800/50 rounded-full w-12 h-12 flex items-center justify-center">
      ›
    </button>
    <div class="max-w-4xl max-h-[85vh] p-2 flex flex-col items-center">
      <img id="lightbox-img" src="" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl">
      <span id="lightbox-counter" class="text-white text-xs mt-3 bg-slate-800/80 px-3 py-1 rounded-full"></span>
    </div>
  </div>

  <!-- Firebase SDK & JS Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgwn1M-tPBlNguY0xjQ7XhTYpybNP08CI",

    // Google Maps 解析
    document.getElementById('parse-btn').addEventListener('click', () => {
      const url = document.getElementById('map-url').value.trim();
      if (!url) return alert('請先貼上網址！');

      const decodedUrl = decodeURIComponent(url);
      const placeMatch = decodedUrl.match(/\/place\/([^\/]+)/);
      let detectedTitle = '';
      if (placeMatch) {
        detectedTitle = placeMatch[1].replace(/\+/g, ' ');
        document.getElementById('title').value = detectedTitle;
      }

      let detectedLat = null, detectedLng = null;
      const preciseCoordMatch = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
      if (preciseCoordMatch) {
        detectedLat = preciseCoordMatch[1];
        detectedLng = preciseCoordMatch[2];
      } else {
        const coordMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (coordMatch) {
          detectedLat = coordMatch[1];
          detectedLng = coordMatch[2];
        }
      }

      if (detectedLat && detectedLng) {
        document.getElementById('lat').value = detectedLat;
        document.getElementById('lng').value = detectedLng;
        updateAdjustMarker(detectedLat, detectedLng);
      }
      document.getElementById('nav-link').value = url;

      const titleAndUrl = (detectedTitle + ' ' + decodedUrl).toLowerCase();
      let matchedCategory = '';
      if (/ramen|拉麵|沾麵|sushi|壽司|烤肉|yakiniku|cafe|咖啡|甜點|居酒屋|美食|food|restaurant/i.test(titleAndUrl)) {
        if (/cafe|咖啡|coffee/i.test(titleAndUrl)) matchedCategory = "咖啡";
        else matchedCategory = "美食";
      } else if (/park|park|shrine|神社|寺|景點|museum|博物館|sky|tower|水族館/i.test(titleAndUrl)) {
        matchedCategory = "景點";
      } else if (/store|shop|bic|yodobashi|唐吉訶德|donki|購物|商場|mall|outlet/i.test(titleAndUrl)) {
        matchedCategory = "購物";
      }

      if (matchedCategory) {
        const catSelect = document.getElementById('category-select');
        for (let option of catSelect.options) {
          if (option.value === matchedCategory) { option.selected = true; break; }
        }
      }

      let matchedRegion = '';
      regions.forEach(r => {
        const keywords = r.split('/');
        keywords.forEach(kw => {
          if (kw && titleAndUrl.includes(kw.toLowerCase())) matchedRegion = r;
        });
      });

      if (matchedRegion) {
        const regSelect = document.getElementById('region-select');
        for (let option of regSelect.options) {
          if (option.value === matchedRegion) { option.selected = true; break; }
        }
      }
    });

      `;
      regions.forEach(r => {
        const count = allPlaces.filter(p => p.region === r || (r.includes('/') && p.region && r.split('/').includes(p.region))).length;
        const active = currentRegion === r;
        regHTML += `
          <button onclick="setRegion('${r}')" class="w-full flex justify-between items-center px-3 py-2 rounded-xl text-xs font-medium transition ${active ? 'bg-[#4f46e5] text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
            <span>${r}</span><span class="${active ? 'bg-indigo-700 text-white' : 'bg-slate-100 text-slate-400'} px-2 py-0.5 rounded-full text-[10px]">${count}</span>
          </button>
        `;
      });
      document.getElementById('region-list').innerHTML = regHTML;

      // 2. 類別頁籤
      let catHTML = `<button onclick="setCategory('all')" class="px-3 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${currentCategory === 'all' ? 'bg-[#4f46e5] text-white' : 'bg-white text-slate-600 border border-slate-200'}">全部</button>`;
      categories.forEach(c => {
        const active = currentCategory === c.name;
        catHTML += `
          <button onclick="setCategory('${c.name}')" class="px-3 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap flex items-center gap-1 ${active ? 'bg-[#4f46e5] text-white' : 'bg-white text-slate-600 border border-slate-200'}">
            <span>${c.name}</span><i class="fa-solid ${c.icon} text-[10px]"></i>
          </button>
        `;
      });
      catHTML += `<button onclick="openManageCategoriesModal()" class="text-xs text-indigo-600 px-2" title="管理類別"><i class="fa-solid fa-gear"></i></button>`;
      document.getElementById('category-tabs').innerHTML = catHTML;

      // 3. 航班與酒店卡片
      const fhSec = document.getElementById('flight-hotel-section');
      fhSec.innerHTML = allFH.map(fh => {
        const isFlight = fh.type === 'flight';
        const mapContainerId = `hotel-map-${fh.id}`;

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between space-y-3">
            <div class="flex justify-between items-start">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="text-xs px-2 py-0.5 rounded-md font-bold ${isFlight ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}">
                    ${isFlight ? '✈️ 航班' : '🏨 酒店'}
                  </span>
                  ${fh.code ? `<span class="text-xs font-mono bg-slate-100 px-2 py-0.5 rounded text-slate-600">代碼: ${fh.code}</span>` : ''}
                </div>
                <h4 class="font-bold text-slate-800 text-sm mt-1">${fh.title}</h4>
                <p class="text-xs text-slate-500">${fh.date1 ? '📅 ' + fh.date1 : ''} ${fh.date2 ? ' ➔ ' + fh.date2 : ''}</p>
                ${fh.extra ? `<p class="text-xs text-slate-600">📌 ${fh.extra}</p>` : ''}
                ${fh.notes ? `<p class="text-xs text-slate-400 italic">${fh.notes}</p>` : ''}
                ${fh.nav ? `<a href="${fh.nav}" target="_blank" class="inline-block text-xs text-indigo-600 hover:underline mt-1"><i class="fa-solid fa-location-arrow"></i> 開啟地圖/導航</a>` : ''}
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openFHModal('${fh.type}', '${fh.id}')" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                <button onclick="deleteFH('${fh.id}')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
              </div>
            </div>

            ${!isFlight && fh.lat && fh.lng ? `<div id="${mapContainerId}" class="hotel-mini-map border"></div>` : ''}
          </div>
        `;
      }).join('');

      setTimeout(() => {
        allFH.forEach(fh => {
          if (fh.type === 'hotel' && fh.lat && fh.lng) {
            const container = document.getElementById(`hotel-map-${fh.id}`);
            if (container && !container._leaflet_id) {
              const miniMap = L.map(`hotel-map-${fh.id}`, { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView([fh.lat, fh.lng], 15);
              L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 19, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(miniMap);
              L.marker([fh.lat, fh.lng]).addTo(miniMap);
            }
          }
        });
      }, 300);

      // 4. 即時過濾搜尋
      const filtered = allPlaces.filter(p => {
        const matchRegion = currentRegion === 'all' || p.region === currentRegion || (currentRegion.includes('/') && p.region && currentRegion.split('/').includes(p.region));
        const matchCategory = currentCategory === 'all' || p.category === currentCategory;
        
        const matchSearch = !searchKeyword || 
          (p.title && p.title.toLowerCase().includes(searchKeyword)) ||
          (p.region && p.region.toLowerCase().includes(searchKeyword)) ||
          (p.category && p.category.toLowerCase().includes(searchKeyword)) ||
          (p.recommendation && p.recommendation.toLowerCase().includes(searchKeyword)) ||
          (p.notes && p.notes.toLowerCase().includes(searchKeyword));

        return matchRegion && matchCategory && matchSearch;
      });

      document.getElementById('current-region-label').innerText = currentRegion === 'all' ? '全部車站' : currentRegion;
      document.getElementById('places-count').innerText = `共 ${filtered.length} 個地點`;

      // 5. 地圖 Pin 點
      initMap();
      Object.values(markersMap).forEach(m => leafletMap.removeLayer(m));
      markersMap = {};
      const bounds = [];

      filtered.forEach(item => {
        if (item.lat && item.lng) {
          const marker = L.marker([item.lat, item.lng]).addTo(leafletMap);
          marker.bindPopup(`
            <div class="p-1 text-center font-sans">
              <div class="font-bold text-xs text-slate-800 mb-0.5">${item.title}</div>
              <div class="text-[10px] text-slate-500 mb-2">📍 ${item.region} | ${item.category}</div>
              <button onclick="scrollToCard('${item.id}')" class="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded-md hover:bg-indigo-700">👇 查看卡片</button>
            </div>
          `);
          markersMap[item.id] = marker;
          bounds.push([item.lat, item.lng]);
        }
      });

      setTimeout(() => {
        leafletMap.invalidateSize();
        if (bounds.length > 0) leafletMap.fitBounds(bounds, { padding: [30, 30] });
      }, 200);

      // 6. 景點卡片
      document.getElementById('places-grid').innerHTML = filtered.map(item => {
        const catObj = categories.find(c => c.name === item.category) || { color: 'bg-indigo-100 text-indigo-800', icon: 'fa-tag' };
        const isVisited = item.status === 'visited';

        const allImgs = [];
        if (item.imageUrl) allImgs.push(item.imageUrl);
        if (item.extraImages && item.extraImages.length > 0) allImgs.push(...item.extraImages);

        const allImgsJson = JSON.stringify(allImgs).replace(/"/g, '&quot;');

        return `
          <div id="card-${item.id}" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between transition-all">
            <div>
              ${item.imageUrl ? `
                <div class="relative cursor-pointer group" onclick="openLightbox(${allImgsJson}, 0)">
                  <img src="${item.imageUrl}" class="w-full h-44 object-cover group-hover:opacity-90 transition" alt="${item.title}">
                  <span class="absolute bottom-2 right-2 bg-slate-900/70 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-sm">
                    <i class="fa-solid fa-expand"></i> 點擊放大 (${allImgs.length}張)
                  </span>
                </div>
              ` : ''}

              <div class="p-4 space-y-3">
                <div class="flex justify-between items-start">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[11px] px-2 py-0.5 rounded-md font-bold ${catObj.color} flex items-center gap-1">${item.category} <i class="fa-solid ${catObj.icon}"></i></span>
                    <span class="text-[11px] px-2 py-0.5 rounded-md font-medium bg-slate-100 text-slate-600">${item.region}</span>
                  </div>
                  <button onclick="toggleCheck('${item.id}', '${item.status}')" class="text-xs font-semibold px-2.5 py-1 rounded-full border transition ${isVisited ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-slate-50 text-slate-500 border-slate-200'}">
                    <i class="fa-regular ${isVisited ? 'fa-circle-check' : 'fa-circle'}"></i> ${isVisited ? '已打卡' : '未打卡'}
                  </button>
                </div>

                <h4 class="font-bold text-base text-slate-800">${item.title}</h4>

                ${item.extraImages && item.extraImages.length > 0 ? `
                  <div class="flex items-center gap-2 overflow-x-auto pt-1 pb-1">
                    ${item.extraImages.map((img, idx) => `
                      <img src="${img}" onclick="openLightbox(${allImgsJson}, ${item.imageUrl ? idx + 1 : idx})" class="w-12 h-12 rounded-lg object-cover cursor-pointer border hover:opacity-80 transition flex-shrink-0">
                    `).join('')}
                  </div>
                ` : ''}

                ${item.recommendation ? `
                  <div class="bg-amber-50/80 text-amber-800 text-xs p-2 rounded-xl border border-amber-100/80 flex items-start gap-1.5">
                    <i class="fa-solid fa-utensils text-amber-600 mt-0.5"></i><span><strong>推介：</strong>${item.recommendation}</span>
                  </div>
                ` : ''}

                ${item.notes ? `
                  <div class="text-xs text-slate-500 flex items-start gap-1.5">
                    <i class="fa-regular fa-file-lines text-slate-400 mt-0.5"></i><span>${item.notes}</span>
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="p-4 pt-0 flex justify-between items-center text-xs text-slate-500 border-t border-slate-50 pt-3 mt-2">
              <button onclick="focusOnMap('${item.id}', ${item.lat}, ${item.lng})" class="text-indigo-600 font-medium flex items-center gap-1 hover:underline">
                <i class="fa-solid fa-map-pin"></i> 顯示地圖
              </button>
              <div class="flex items-center gap-3">
                ${item.navLink ? `<a href="${item.navLink}" target="_blank" class="text-slate-600 font-medium hover:text-indigo-600"><i class="fa-solid fa-location-arrow"></i> 導航</a>` : ''}
                <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-indigo-600" title="編輯"><i class="fa-solid fa-pen-to-square"></i></button>
                <button onclick="deletePlace('${item.id}')" class="text-slate-300 hover:text-red-500" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setRegion = (r) => { currentRegion = r; renderApp(); };
    window.setCategory = (c) => { currentCategory = c; renderApp(); };

    onSnapshot(doc(db, "settings", "app_config"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.regions) regions = data.regions;
        if (data.categories) categories = data.categories;
        renderApp();
      }
    });

    onSnapshot(doc(db, "settings", "memo"), (docSnap) => {
      if (docSnap.exists() && document.activeElement !== memoInput) {
        memoInput.value = docSnap.data().content || '';
        memoStatus.innerText = '已同步至雲端';
      }
    });

    // 監聽備忘錄圖片與分隔線
    onSnapshot(collection(db, "memo_items"), (snapshot) => {
      allMemoItems = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      allMemoItems.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

      const container = document.getElementById('memo-items-container');
      const allMemoImgs = allMemoItems.filter(i => i.type === 'image').map(i => i.imageUrl);

      container.innerHTML = allMemoItems.map(item => {
        if (item.type === 'divider') {
          return `
            <div class="flex justify-between items-center border-b border-amber-300/80 pt-2 pb-1 my-1">
              <span class="font-bold text-amber-900 text-xs">--- ${item.title} ---</span>
              <button onclick="deleteMemoItem('${item.id}')" class="text-slate-400 hover:text-red-500 text-[11px]">✕</button>
            </div>
          `;
        }
        const imgIndex = allMemoImgs.indexOf(item.imageUrl);
        const jsonImgs = JSON.stringify(allMemoImgs).replace(/"/g, '&quot;');
        return `
          <div class="relative group inline-block mr-2 mb-2">
            <img src="${item.imageUrl}" onclick="openLightbox(${jsonImgs}, ${imgIndex})" class="w-20 h-20 object-cover rounded-xl border border-amber-200 cursor-pointer hover:opacity-80 transition shadow-sm">
            <button onclick="deleteMemoItem('${item.id}')" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">✕</button>
          </div>
        `;
      }).join('');
    });

    // 監聽 QR Code 清單
    onSnapshot(collection(db, "qrcodes"), (snapshot) => {
      allQRCodes = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      allQRCodes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      const listEl = document.getElementById('qr-code-list');
      const allQRImgs = allQRCodes.map(q => q.imageUrl);

      listEl.innerHTML = allQRCodes.map((qr, idx) => {
        const jsonImgs = JSON.stringify(allQRImgs).replace(/"/g, '&quot;');
        return `
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 overflow-hidden">
              <img src="${qr.imageUrl}" onclick="openLightbox(${jsonImgs}, ${idx})" class="w-12 h-12 object-cover rounded-lg border cursor-pointer hover:opacity-80 shrink-0">
              <span class="font-semibold text-slate-800 text-xs truncate">${qr.title}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="editQRCode('${qr.id}', '${qr.title}')" class="text-slate-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
              <button onclick="deleteQRCode('${qr.id}')" class="text-slate-300 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          </div>
        `;
      }).join('');
    });

    onSnapshot(collection(db, "places"), (snapshot) => {
      allPlaces = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      renderApp();
    });

    onSnapshot(collection(db, "flight_hotel"), (snapshot) => {
      allFH = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      renderApp();
    });

    onSnapshot(collection(db, "todos"), (snapshot) => {
      allTodos = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      allTodos.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = allTodos.map(t => {
        if (t.isDivider) {
          return `
            <div data-todo-id="${t.id}" class="font-bold text-slate-700 bg-slate-100 p-1.5 rounded-lg border-l-4 border-indigo-600 flex justify-between items-center my-1.5">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-grip-vertical drag-handle cursor-grab text-slate-300"></i>
                <span>--- ${t.title} ---</span>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="editTodo('${t.id}', '${t.title}')" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen-to-square text-[11px]"></i></button>
                <button onclick="deleteTodo('${t.id}')" class="text-slate-300 hover:text-red-500 text-[11px]">✕</button>
              </div>
            </div>
          `;
        }
        return `
          <div data-todo-id="${t.id}" class="flex justify-between items-center p-1.5 bg-slate-50 rounded-lg hover:bg-slate-100 border border-slate-100">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-grip-vertical drag-handle cursor-grab text-slate-300"></i>
              <label class="flex items-center gap-2 cursor-pointer text-xs ${t.done ? 'line-through text-slate-400' : 'text-slate-700'}">
                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo('${t.id}', ${t.done})" class="rounded text-indigo-600 focus:ring-indigo-500">
                <span>${t.title}</span>
              </label>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="editTodo('${t.id}', '${t.title}')" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen-to-square text-[11px]"></i></button>
              <button onclick="deleteTodo('${t.id}')" class="text-slate-300 hover:text-red-500 text-[11px]">✕</button>
            </div>
          </div>
        `;
      }).join('');

      initTodoSortable();
    });
  </script>
</body>
</html>
