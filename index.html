<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京行程地圖 2026</title>
  
  <!-- Leaflet CSS (免費地圖套件) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Tailwind CSS (美化樣式) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 400px; width: 100%; border-radius: 12px; }
    .card-highlight {
      animation: highlight 2s ease-in-out;
    }
    @keyframes highlight {
      0% { transform: scale(1); ring: 4px #3b82f6; }
      50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🇯🇵</span> 東京行程總覽與地圖
      </h1>
      <span class="text-xs bg-blue-700 px-3 py-1 rounded-full">即時同步中</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- 大地圖區塊 -->
    <section class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-3 text-gray-800 flex items-center gap-2">
        <span>🗺️</span> 東京行程大地圖
      </h2>
      <div id="map" class="shadow-inner"></div>
      <p class="text-xs text-gray-500 mt-2">💡 點擊地圖上的標記，可預覽名稱與車站；點擊氣泡內的「查看詳情」可跳轉至下方卡片。</p>
    </section>

    <!-- 表單：新增地點 -->
    <section class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">
        <span>➕</span> 新增地點
      </h2>
      
      <form id="add-form" class="space-y-4">
        <!-- Google Maps 連結自動解析 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Google Maps 網址 (貼上長網址可自動提取)</label>
          <div class="flex gap-2">
            <input type="url" id="map-url" placeholder="https://www.google.com/maps/place/..." class="flex-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="button" id="parse-btn" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700">自動解析</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">景點 / 店名 *</label>
            <input type="text" id="title" required placeholder="例如：一蘭拉麵 新宿中央東口店" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">所屬車站 / 區域 *</label>
            <input type="text" id="station" required placeholder="例如：新宿 / 澀谷" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">類別 *</label>
            <select id="category" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="美食">🍜 美食</option>
              <option value="景點">⛩️ 景點</option>
              <option value="購物">🛍️ 購物</option>
              <option value="住宿">🏨 住宿</option>
              <option value="其他">📌 其他</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Google Maps 導航連結</label>
            <input type="url" id="nav-link" placeholder="可貼上短網址或長網址" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <!-- 隱藏座標 (解析用) -->
        <input type="hidden" id="lat">
        <input type="hidden" id="lng">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">備註 / 營業時間</label>
          <textarea id="notes" rows="2" placeholder="例如：11:00-22:00，必食豚骨拉麵" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">儲存景點</button>
      </form>
    </section>

    <!-- 地點列表卡片區 -->
    <section>
      <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">
        <span>📋</span> 已清單地點
      </h2>
      <div id="places-list" class="space-y-4">
        <!-- 卡片會由 JS 動態生成 -->
      </div>
    </section>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ 請記得將以下設定替換為你原本 Firebase 專案的配置 ⚠️
    const firebaseConfig = {
      apiKey: "AIzaSyDgwn1M-tPBlNguY0xjQ7XhTYpybNP08CI",
      authDomain: "tokyo-travel-2026-9a82e.firebaseapp.com",
      projectId: "tokyo-travel-2026-9a82e",
      storageBucket: "tokyo-travel-2026-9a82e.firebasestorage.app",
      messagingSenderId: "1066036344126",
      appId: "1:1066036344126:web:8e47e8497866ea8206e86f",
      measurementId: "G-6MFJZKJZ6H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 初始化 Leaflet 地圖 (預設中心為東京站)
    const map = L.map('map').setView([35.681236, 139.767125], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markersMap = {}; // 儲存 Marker 參照

    // 東京主要車站座標參考庫 (用於自動估算車站)
    const stations = [
      { name: "新宿", lat: 35.6896, lng: 139.7006 },
      { name: "澀谷", lat: 35.6580, lng: 139.7016 },
      { name: "東京站", lat: 35.6812, lng: 139.7671 },
      { name: "上野", lat: 35.7138, lng: 139.7773 },
      { name: "淺草", lat: 35.7111, lng: 139.7964 },
      { name: "銀座", lat: 35.6719, lng: 139.7648 },
      { name: "池袋", lat: 35.7295, lng: 139.7109 },
      { name: "秋葉原", lat: 35.6983, lng: 139.7731 },
      { name: "六本木", lat: 35.6628, lng: 139.7313 }
    ];

    // 計算距離推算最近車站
    function findNearestStation(lat, lng) {
      let minDistance = Infinity;
      let nearest = "東京區";
      stations.forEach(s => {
        const dist = Math.hypot(s.lat - lat, s.lng - lng);
        if (dist < minDistance) {
          minDistance = dist;
          nearest = s.name;
        }
      });
      return nearest;
    }

    // 解析 Google Maps 長網址
    document.getElementById('parse-btn').addEventListener('click', () => {
      const url = document.getElementById('map-url').value;
      if (!url) return alert('請先貼上 Google Maps 網址！');

      // 提取店名
      const placeMatch = url.match(/\/place\/([^\/]+)/);
      if (placeMatch) {
        document.getElementById('title').value = decodeURIComponent(placeMatch[1].replace(/\+/g, ' '));
      }

      // 提取座標
      const coordMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (coordMatch) {
        const lat = parseFloat(coordMatch[1]);
        const lng = parseFloat(coordMatch[2]);
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;

        // 自動推定車站
        const station = findNearestStation(lat, lng);
        document.getElementById('station').value = station;
      }

      // 自動預設導航連結
      document.getElementById('nav-link').value = url;
    });

    // 表單提交儲存至 Firebase
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPlace = {
        title: document.getElementById('title').value,
        station: document.getElementById('station').value,
        category: document.getElementById('category').value,
        navLink: document.getElementById('nav-link').value,
        notes: document.getElementById('notes').value,
        lat: parseFloat(document.getElementById('lat').value) || null,
        lng: parseFloat(document.getElementById('lng').value) || null,
        createdAt: new Date()
      };

      await addDoc(collection(db, "places"), newPlace);
      document.getElementById('add-form').reset();
    });

    // 捲動至卡片並高亮
    window.scrollToCard = function(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('card-highlight', 'ring-4', 'ring-blue-500');
        setTimeout(() => {
          card.classList.remove('card-highlight', 'ring-4', 'ring-blue-500');
        }, 2000);
      }
    };

    // 刪除地點
    window.deletePlace = async function(id) {
      if (confirm("確定要刪除這個地點嗎？")) {
        await deleteDoc(doc(db, "places", id));
      }
    };

    // 即時監聽 Firebase 資料更新
    onSnapshot(collection(db, "places"), (snapshot) => {
      const listEl = document.getElementById('places-list');
      listEl.innerHTML = '';

      // 清除舊 Marker
      Object.values(markersMap).forEach(m => map.removeLayer(m));

      const bounds = [];

      snapshot.docs.forEach(docSnap => {
        const item = docSnap.data();
        const id = docSnap.id;

        // 地圖上加 Pin & 彈出框 (Popup)
        if (item.lat && item.lng) {
          const marker = L.marker([item.lat, item.lng]).addTo(map);
          bounds.push([item.lat, item.lng]);

          // 核心需求：點擊 Pin 先 show 出名稱框，再點框內的按鈕捲動到下方
          const popupContent = `
            <div class="p-1 text-center">
              <div class="font-bold text-sm text-gray-800">${item.title}</div>
              <div class="text-xs text-gray-500 mb-2">📍 ${item.station} | ${item.category}</div>
              <button onclick="scrollToCard('${id}')" class="bg-blue-600 text-white text-xs px-3 py-1 rounded hover:bg-blue-700">
                👇 查看詳情
              </button>
            </div>
          `;
          marker.bindPopup(popupContent);
          markersMap[id] = marker;
        }

        // 渲染下方卡片
        const card = document.createElement('div');
        card.id = `card-${id}`;
        card.className = "bg-white p-5 rounded-xl shadow border border-gray-100 transition-all";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded mr-2">${item.category}</span>
              <span class="text-xs bg-gray-100 text-gray-700 font-medium px-2.5 py-0.5 rounded">📍 ${item.station}</span>
              <h3 class="text-lg font-bold text-gray-800 mt-1">${item.title}</h3>
            </div>
            <button onclick="deletePlace('${id}')" class="text-red-400 hover:text-red-600 text-sm">✕ 刪除</button>
          </div>
          ${item.notes ? `<p class="text-sm text-gray-600 mb-3 bg-gray-50 p-2.5 rounded-lg">📝 ${item.notes}</p>` : ''}
          <div class="flex gap-2">
            ${item.navLink ? `<a href="${item.navLink}" target="_blank" class="text-xs bg-green-600 text-white px-3 py-1.5 rounded-lg hover:bg-green-700 inline-flex items-center gap-1">🧭 開啟 Google Maps 導航</a>` : ''}
          </div>
        `;
        listEl.appendChild(card);
      });

      // 自動調整地圖縮放以容納所有 Pin
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    });
  </script>
</body>
</html>
