<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本旅遊行程地圖</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #region-map { height: 320px; width: 100%; border-radius: 1rem; z-index: 1; }
    .card-highlight {
      animation: highlight 2s ease-in-out;
    }
    @keyframes highlight {
      0% { transform: scale(1); ring: 4px #4f46e5; }
      50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(79, 70, 229, 0.4); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="map-pin" class="w-6 h-6"></i>
        <h1 class="text-lg font-bold">日本行程隨身手冊</h1>
      </div>
      <button onclick="openModal()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-xl text-sm font-medium backdrop-blur-sm flex items-center gap-1.5 border border-white/20 transition">
        <i data-lucide="plus" class="w-4 h-4"></i> 新增地點
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- 區域選擇頁籤 (例如：全部、東京、大阪...) -->
    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="region-tabs">
      <button onclick="filterRegion('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm transition">
        🌏 全部地點
      </button>
      <button onclick="filterRegion('東京')" id="tab-東京" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition">
        🗼 東京
      </button>
      <button onclick="filterRegion('關西')" id="tab-關西" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition">
        🏯 關西 / 京都大阪
      </button>
    </div>

    <!-- 類別篩選 (美食、景點、購物等) -->
    <div class="flex gap-2 overflow-x-auto pb-1" id="category-tabs">
      <button onclick="filterCategory('all')" class="cat-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-lg text-xs font-medium">全部類別</button>
      <button onclick="filterCategory('美食')" class="cat-btn bg-white text-slate-600 px-3 py-1 rounded-lg text-xs font-medium border">🍜 美食</button>
      <button onclick="filterCategory('景點')" class="cat-btn bg-white text-slate-600 px-3 py-1 rounded-lg text-xs font-medium border">⛩️ 景點</button>
      <button onclick="filterCategory('購物')" class="cat-btn bg-white text-slate-600 px-3 py-1 rounded-lg text-xs font-medium border">🛍️ 購物</button>
      <button onclick="filterCategory('住宿')" class="cat-btn bg-white text-slate-600 px-3 py-1 rounded-lg text-xs font-medium border">🏨 住宿</button>
    </div>

    <!-- 動態大地圖區塊（預設隱藏，只有選擇特定區域如「東京」才會出現於頂部） -->
    <div id="map-container" class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 hidden">
      <div class="flex justify-between items-center mb-2 px-1">
        <span id="map-title" class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
          <i data-lucide="map" class="w-4 h-4 text-indigo-600"></i> 區域地圖總覽
        </span>
        <span class="text-[10px] text-slate-400">點擊標記預覽名稱</span>
      </div>
      <div id="region-map"></div>
    </div>

    <!-- 地點列表 -->
    <div id="places-list" class="space-y-4">
      <!-- 卡片由 JS 動態生成 -->
    </div>

  </main>

  <!-- 新增/編輯地點 彈出視窗 (Modal) -->
  <div id="placeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl flex flex-col">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
        <h3 id="modalTitle" class="font-bold text-slate-800 flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i> 新增地點
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="add-form" class="p-5 space-y-4 text-sm">
        <!-- 網址解析區 -->
        <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100">
          <label class="block font-medium text-slate-700 mb-1 text-xs">Google Maps 網址 (自動解析店名/車站)</label>
          <div class="flex gap-2">
            <input type="url" id="map-url" placeholder="貼上完整 Google Maps 網址" class="flex-1 p-2 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="button" id="parse-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-indigo-700">解析</button>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">景點 / 店名 *</label>
          <input type="text" id="title" required class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">大區域 (例如：東京)</label>
            <input type="text" id="region" required placeholder="東京" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">車站 / 細區 *</label>
            <input type="text" id="station" required placeholder="新宿" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">類別 *</label>
            <select id="category" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
              <option value="美食">🍜 美食</option>
              <option value="景點">⛩️ 景點</option>
              <option value="購物">🛍️ 購物</option>
              <option value="住宿">🏨 住宿</option>
              <option value="其他">📌 其他</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">導航連結</label>
            <input type="url" id="nav-link" placeholder="短網址或長網址" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <input type="hidden" id="lat">
        <input type="hidden" id="lng">

        <div>
          <label class="block font-medium text-slate-700 mb-1">備註 / 營業時間</label>
          <textarea id="notes" rows="2" placeholder="例如：11:00-22:00，必食清單" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium shadow-md shadow-indigo-100 hover:bg-indigo-700 transition">儲存地點</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 使用你提供的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDgwn1M-tPBlNguY0xjQ7XhTYpybNP08CI",
      authDomain: "tokyo-travel-2026-9a82e.firebaseapp.com",
      projectId: "tokyo-travel-2026-9a82e",
      storageBucket: "tokyo-travel-2026-9a82e.firebasestorage.app",
      messagingSenderId: "1066036344126",
      appId: "1:1066036344126:web:8e47e8497866ea8206e86f",
      measurementId: "G-6MFJZKJZ6H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentRegion = 'all';
    let currentCategory = 'all';
    let allPlaces = [];
    let leafletMap = null;
    let markersGroup = [];

    // 初始化 Leaflet 地圖
    function initMap() {
      if (!leafletMap) {
        leafletMap = L.map('region-map').setView([35.6812, 139.7671], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(leafletMap);
      }
    }

    // Modal 控制
    window.openModal = () => document.getElementById('placeModal').classList.remove('hidden');
    window.closeModal = () => document.getElementById('placeModal').classList.add('hidden');

    // 區域與類別過濾邏輯
    window.filterRegion = (region) => {
      currentRegion = region;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition';
      });
      const activeTab = document.getElementById(`tab-${region}`) || document.getElementById('tab-all');
      if (activeTab) activeTab.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm transition';

      renderPlaces();
    };

    window.filterCategory = (cat) => {
      currentCategory = cat;
      renderPlaces();
    };

    // 捲動至卡片並高亮
    window.scrollToCard = (id) => {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('card-highlight', 'ring-4', 'ring-indigo-500');
        setTimeout(() => {
          card.classList.remove('card-highlight', 'ring-4', 'ring-indigo-500');
        }, 2000);
      }
    };

    // 刪除地點
    window.deletePlace = async (id) => {
      if (confirm("確定要刪除這個地點嗎？")) {
        await deleteDoc(doc(db, "places", id));
      }
    };

    // 網址解析
    document.getElementById('parse-btn').addEventListener('click', () => {
      const url = document.getElementById('map-url').value;
      if (!url) return alert('請先貼上網址！');

      const placeMatch = url.match(/\/place\/([^\/]+)/);
      if (placeMatch) {
        document.getElementById('title').value = decodeURIComponent(placeMatch[1].replace(/\+/g, ' '));
      }

      const coordMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (coordMatch) {
        document.getElementById('lat').value = coordMatch[1];
        document.getElementById('lng').value = coordMatch[2];
      }
      document.getElementById('nav-link').value = url;
      if (!document.getElementById('region').value) document.getElementById('region').value = "東京";
    });

    // 表單提交
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPlace = {
        title: document.getElementById('title').value,
        region: document.getElementById('region').value || "東京",
        station: document.getElementById('station').value,
        category: document.getElementById('category').value,
        navLink: document.getElementById('nav-link').value,
        notes: document.getElementById('notes').value,
        lat: parseFloat(document.getElementById('lat').value) || null,
        lng: parseFloat(document.getElementById('lng').value) || null,
        createdAt: new Date()
      };

      await addDoc(collection(db, "places"), newPlace);
      document.getElementById('add-form').reset();
      closeModal();
    });

    // 渲染資料與地圖
    function renderPlaces() {
      const listEl = document.getElementById('places-list');
      listEl.innerHTML = '';

      // 篩選資料
      const filtered = allPlaces.filter(item => {
        const matchRegion = (currentRegion === 'all') || (item.region === currentRegion) || (currentRegion === '東京' && (!item.region || item.region.includes('東京')));
        const matchCat = (currentCategory === 'all') || (item.category === currentCategory);
        return matchRegion && matchCat;
      });

      // 控制地圖顯示邏輯：當選擇了非 'all' 的區域（如選擇「東京」）時顯示大地圖
      const mapContainer = document.getElementById('map-container');
      if (currentRegion !== 'all') {
        mapContainer.classList.remove('hidden');
        document.getElementById('map-title').innerText = `🗺️ ${currentRegion} 區域地圖總覽`;
        initMap();

        // 重繪地圖標記
        markersGroup.forEach(m => leafletMap.removeLayer(m));
        markersGroup = [];
        const bounds = [];

        filtered.forEach(item => {
          if (item.lat && item.lng) {
            const marker = L.marker([item.lat, item.lng]).addTo(leafletMap);
            
            // 點擊 Pin 彈出名稱與詳情按鈕
            const popupContent = `
              <div class="p-1 text-center font-sans">
                <div class="font-bold text-xs text-slate-800 mb-0.5">${item.title}</div>
                <div class="text-[10px] text-slate-500 mb-2">📍 ${item.station} | ${item.category}</div>
                <button onclick="scrollToCard('${item.id}')" class="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded-md hover:bg-indigo-700 transition">
                  👇 查看詳情
                </button>
              </div>
            `;
            marker.bindPopup(popupContent);
            markersGroup.push(marker);
            bounds.push([item.lat, item.lng]);
          }
        });

        setTimeout(() => {
          leafletMap.invalidateSize();
          if (bounds.length > 0) {
            leafletMap.fitBounds(bounds, { padding: [30, 30] });
          }
        }, 200);
      } else {
        mapContainer.classList.add('hidden');
      }

      // 渲染地點卡片
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.id = `card-${item.id}`;
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 transition-all";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-[11px] bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded-md border border-indigo-100 mr-1.5">${item.category}</span>
              <span class="text-[11px] bg-slate-100 text-slate-600 font-medium px-2 py-0.5 rounded-md">📍 ${item.station}</span>
              <h3 class="text-base font-bold text-slate-800 mt-1.5">${item.title}</h3>
            </div>
            <button onclick="deletePlace('${item.id}')" class="text-slate-300 hover:text-red-500 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
          ${item.notes ? `<p class="text-xs text-slate-600 mb-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">📝 ${item.notes}</p>` : ''}
          <div class="flex gap-2 pt-1">
            ${item.navLink ? `
              <a href="${item.navLink}" target="_blank" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-medium hover:bg-emerald-700 inline-flex items-center gap-1 shadow-sm transition">
                <i data-lucide="navigation" class="w-3.5 h-3.5"></i> 開啟 Google Maps 導航
              </a>
            ` : ''}
          </div>
        `;
        listEl.appendChild(card);
      });

      lucide.createIcons();
    }

    // 監聽 Firebase 資料
    onSnapshot(collection(db, "places"), (snapshot) => {
      allPlaces = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));
      renderPlaces();
    });
  </script>
</body>
</html>
