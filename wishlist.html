<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>想買清單相簿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body class="bg-[#f3f4f6] dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">

  <header class="bg-[#4f46e5] dark:bg-slate-800 text-white px-4 py-3 shadow-md sticky top-0 z-40 border-b dark:border-slate-700">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2.5">
      <div class="w-full md:w-auto flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-2">
          <i class="fa-regular fa-compass text-lg"></i>
          <h1 class="text-base font-bold whitespace-nowrap">想買清單相簿</h1>
          <button id="theme-toggle-btn" onclick="toggleDarkMode()" class="bg-indigo-700/80 hover:bg-indigo-600 dark:bg-slate-700 text-yellow-300 w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-sm transition ml-1">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
          </button>
        </div>

        <nav class="flex items-center bg-indigo-700/70 dark:bg-slate-700 p-1 rounded-xl text-xs font-bold gap-1 w-full sm:w-auto justify-around">
          <a href="index.html" class="flex-1 sm:flex-initial px-2.5 py-1.5 rounded-lg text-white hover:bg-indigo-600 transition whitespace-nowrap flex items-center justify-center gap-1">
            <i class="fa-solid fa-map-location-dot"></i> 行程地圖
          </a>
          <a href="expenses.html" class="flex-1 sm:flex-initial px-2.5 py-1.5 rounded-lg text-white hover:bg-indigo-600 transition whitespace-nowrap flex items-center justify-center gap-1">
            <i class="fa-solid fa-receipt"></i> 記帳收據
          </a>
          <a href="wishlist.html" class="flex-1 sm:flex-initial px-2.5 py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition whitespace-nowrap flex items-center justify-center gap-1">
            <i class="fa-solid fa-bag-shopping"></i> 想買相簿
          </a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
      <div class="flex justify-between items-center border-b dark:border-slate-700 pb-2">
        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm flex items-center gap-2">
          <i class="fa-solid fa-bag-shopping text-pink-600"></i> 新增想買/代購物品
        </h3>
        <span class="text-[11px] text-slate-400">可拖動相片自由排序位置</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
        <div>
          <label class="block font-medium mb-1">物品圖片 *</label>
          <input type="file" id="shop-img-file" accept="image/*" class="w-full p-1 bg-slate-50 dark:bg-slate-700 border rounded-lg text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-pink-600 file:text-white">
        </div>
        <div>
          <label class="block font-medium mb-1">名稱 / 品名 *</label>
          <input type="text" id="shop-title-input" placeholder="例如: 公仔 / 藥妝" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border rounded-lg outline-none">
        </div>
        <div>
          <label class="block font-medium mb-1">備註 / 價格 / 購買地點</label>
          <input type="text" id="shop-note-input" placeholder="例如: 涉谷 PARCO / 約 ¥3,000" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border rounded-lg outline-none">
        </div>
        <div class="flex items-end">
          <button type="button" onclick="addShoppingItem()" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-lg font-bold shadow-sm transition">
            + 新增至相簿
          </button>
        </div>
      </div>
    </div>

    <div>
      <h4 class="font-bold text-slate-700 dark:text-slate-200 text-sm mb-3 flex items-center gap-1.5">
        <i class="fa-solid fa-images text-pink-600"></i> 想買清單相簿 (<span id="shopping-count">0</span> 件)
      </h4>
      <div id="shopping-album-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>
  </main>

  <div id="lightboxModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center hidden p-4 select-none" onclick="closeLightbox()">
    <img id="lightbox-img" src="" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl">
  </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgwn1M-tPBlNguY0xjQ7XhTYpybNP08CI",
      authDomain: "tokyo-travel-2026-9a82e.firebaseapp.com",
      projectId: "tokyo-travel-2026-9a82e",
      storageBucket: "tokyo-travel-2026-9a82e.firebasestorage.app",
      messagingSenderId: "1066036344126",
      appId: "1:1066036344126:web:8e47e8497866ea8206e86f",
      measurementId: "G-6MFJZKJZ6H"
    };

    const app = initializeApp(firebaseConfig);
    import { initializeFirestore, persistentLocalCache } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({})
    });

    async function compressImage(file, maxDim = 600, quality = 0.6) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
            else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    let allShoppingItems = [];

    window.addShoppingItem = async () => {
      const fileInput = document.getElementById('shop-img-file');
      const title = document.getElementById('shop-title-input').value.trim();
      const note = document.getElementById('shop-note-input').value.trim();

      if (fileInput.files.length === 0) return alert("請先選取圖片！");
      if (!title) return alert("請輸入名稱！");

      const b64 = await compressImage(fileInput.files[0]);
      await addDoc(collection(db, "shopping_items"), {
        imageUrl: b64,
        title: title,
        note: note,
        order: allShoppingItems.length,
        createdAt: new Date()
      });

      fileInput.value = '';
      document.getElementById('shop-title-input').value = '';
      document.getElementById('shop-note-input').value = '';
    };

    window.deleteShoppingItem = async (id) => {
      if (confirm("確定刪除這件想買物品？")) await deleteDoc(doc(db, "shopping_items", id));
    };

    function renderShoppingAlbum() {
      const container = document.getElementById('shopping-album-grid');
      document.getElementById('shopping-count').innerText = allShoppingItems.length;

      if (allShoppingItems.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs">暫無想買物品</div>`;
        return;
      }

      container.innerHTML = allShoppingItems.map((item, idx) => `
        <div data-shop-id="${item.id}" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden relative group">
          <button onclick="deleteShoppingItem('${item.id}')" class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition z-10">✕</button>
          <div class="w-full aspect-square bg-slate-100 cursor-pointer overflow-hidden" onclick="openLightbox('${item.imageUrl}')">
            <img src="${item.imageUrl}" class="w-full h-full object-cover">
          </div>
          <div class="p-2 space-y-0.5">
            <div class="font-bold text-xs truncate">${item.title}</div>
            ${item.note ? `<div class="text-[10px] text-slate-400 truncate">${item.note}</div>` : ''}
          </div>
        </div>
      `).join('');

      Sortable.create(container, {
        animation: 150,
        onEnd: async () => {
          const ids = Array.from(container.querySelectorAll('[data-shop-id]')).map(el => el.getAttribute('data-shop-id'));
          for (let i = 0; i < ids.length; i++) {
            await updateDoc(doc(db, "shopping_items", ids[i]), { order: i });
          }
        }
      });
    }

    onSnapshot(collection(db, "shopping_items"), (snapshot) => {
      allShoppingItems = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      allShoppingItems.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      renderShoppingAlbum();
    });

    window.openLightbox = (src) => {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightboxModal').classList.remove('hidden');
    };
    window.closeLightbox = () => document.getElementById('lightboxModal').classList.add('hidden');

    window.toggleDarkMode = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    };
    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-icon');
      if (icon) icon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-yellow-300';
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      updateThemeIcon(true);
    }
  </script>
</body>
</html>
